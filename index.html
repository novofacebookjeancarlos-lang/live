<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lo-fi de Madrugada</title>
  <link rel="stylesheet" href="scene.css">
  <script src="player.js" defer></script>
</head>
<body>
  <main aria-label="Lo-fi de Madrugada">
    <div class="scene">
      <video loop playsinline preload="metadata" aria-label="Vídeo da live"></video>
    </div>
    <audio loop preload="metadata" data-track=""></audio>
    <div class="controls">
      <p id="status" role="status" hidden></p>
      <div class="actions">
        <button id="choose-video" type="button">Escolher vídeo</button>
        <button id="choose" type="button">Escolher música</button>
        <button id="play" type="button" hidden>Iniciar</button>
        <button id="fullscreen" type="button">Tela cheia</button>
        <button id="hide" type="button">Ocultar controles</button>
        <input id="video-file" type="file" accept="video/*,.mp4,.webm" hidden>
        <input id="music-file" type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav" hidden>
      </div>
    </div>
  </main>
</body>
</html>
